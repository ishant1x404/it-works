<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090d"><title>it-works!)</title><link rel="stylesheet" href="assets/css/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js" defer></script><script src="assets/js/app.js" defer></script></head>
<body><div class="app"><header class="topbar"><button class="brand" id="brand">it-works<span>!)</span></button><div class="top-right"><span class="status-dot"></span><span id="identity">Connecting…</span><button class="icon-btn" id="signOutBtn" hidden>Sign out</button></div></header><main class="main">
<section class="view active" id="homeView"><div class="home-actions"><button class="action" data-go="createRoomView"><span class="symbol">＋</span><span>Create a room</span><span class="arrow">›</span></button><button class="action primary" data-go="joinRoomView"><span class="symbol">→</span><span>Join a room</span><span class="arrow">›</span></button><div class="or">or</div><div class="secondary-actions"><button class="action" data-go="loginView">Login <span class="arrow">›</span></button><button class="action" data-go="signupView">Create account <span class="arrow">›</span></button></div><div class="chat-note">Text-only rooms · Up to 16 people</div><div class="error" id="homeError"></div></div></section>
<section class="view" id="createRoomView"><button class="back" data-go="homeView">← Back</button><form class="form-card" id="createRoomForm"><h1>Create a room</h1><p class="sub">Choose a code or leave it blank for a random one.</p><label>Room code (optional)</label><input id="customCode" maxlength="12" pattern="[A-Za-z0-9_-]{3,12}" placeholder="e.g. A7K2"><div class="error" id="createError"></div><button class="btn">Create room</button></form></section>
<section class="view" id="joinRoomView"><button class="back" data-go="homeView">← Back</button><form class="form-card" id="joinRoomForm"><h1>Join a room</h1><p class="sub">Enter the room code.</p><label>Room code</label><input id="joinCode" required maxlength="12" placeholder="e.g. A7K2"><div class="error" id="joinError"></div><button class="btn">Join room</button></form></section>
<section class="view" id="loginView"><button class="back" data-go="homeView">← Back</button><form class="form-card" id="loginForm"><h1>Login</h1><p class="sub">Use your username and password.</p><label>Username</label><input id="loginUsername" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" autocomplete="username"><label>Password</label><input id="loginPassword" type="password" required autocomplete="current-password"><div class="error" id="loginError"></div><button class="btn">Login</button><button class="btn flat" type="button" id="guestLogin">Continue as guest</button></form></section>
<section class="view" id="signupView"><button class="back" data-go="homeView">← Back</button><form class="form-card" id="signupForm"><h1>Create account</h1><p class="sub">Accounts are optional.</p><label>Username</label><input id="signupUsername" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" autocomplete="username"><label>Password</label><input id="signupPassword" type="password" required minlength="8" autocomplete="new-password"><label>Confirm password</label><input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password"><div class="error" id="signupError"></div><button class="btn">Create account</button><button class="btn flat" type="button" id="guestSignup">Continue as guest</button></form></section>
<section class="view" id="chatView"><div class="chat-shell"><div class="chat-head"><div class="room-title">ROOM / <span id="activeRoomCode"></span></div><div class="room-tools"><span class="count" id="participantCount">0/16 people</span><button class="leave" id="leaveBtn">Leave</button></div></div><div class="messages" id="messages" aria-live="polite"></div><form class="composer" id="messageForm"><input id="messageInput" maxlength="2000" autocomplete="off" placeholder="message…" aria-label="Message" required><button class="send" aria-label="Send message">➜</button></form></div><div class="chat-note">Your color is assigned for this room.</div></section>
</main></div><div class="toast hidden" id="toast" role="status"></div></body></html>
